services:
  - type: web
    name: ipo-widget
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GMP_REFRESH_SECONDS
        value: "300"
      - key: SUBSCRIPTION_REFRESH_SECONDS
        value: "300"
      - key: METADATA_REFRESH_SECONDS
        value: "3600"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DISABLE_BACKGROUND_REFRESH
        value: "0"
